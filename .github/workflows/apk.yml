# Budget familial : ce fichier demande à GitHub de fabriquer l'APK.
# Il se lance tout seul à chaque fois que tu envoies un nouveau index.html.
name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: "Projet - settings.gradle"
        run: |
          mkdir -p "$(dirname 'android/settings.gradle')"
          cat > 'android/settings.gradle' <<'FIN_DU_FICHIER'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BudgetFamilial"
          include ':app'
          FIN_DU_FICHIER

      - name: "Projet - build.gradle"
        run: |
          mkdir -p "$(dirname 'android/build.gradle')"
          cat > 'android/build.gradle' <<'FIN_DU_FICHIER'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          FIN_DU_FICHIER

      - name: "Projet - gradle.properties"
        run: |
          mkdir -p "$(dirname 'android/gradle.properties')"
          cat > 'android/gradle.properties' <<'FIN_DU_FICHIER'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          FIN_DU_FICHIER

      - name: "Appli - build.gradle"
        run: |
          mkdir -p "$(dirname 'android/app/build.gradle')"
          cat > 'android/app/build.gradle' <<'FIN_DU_FICHIER'
          plugins {
              id 'com.android.application'
          }

          def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

          android {
              namespace 'com.heryzo.budgetfamilial'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.heryzo.budgetfamilial'
                  minSdk 24
                  targetSdk 34
                  versionCode runNumber
                  versionName "1." + runNumber
              }

              signingConfigs {
                  release {
                      storeFile file('budget.jks')
                      storePassword 'budgetfamilial'
                      keyAlias 'budget'
                      keyPassword 'budgetfamilial'
                      storeType 'pkcs12'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          FIN_DU_FICHIER

      - name: "Appli - AndroidManifest.xml"
        run: |
          mkdir -p "$(dirname 'android/app/src/main/AndroidManifest.xml')"
          cat > 'android/app/src/main/AndroidManifest.xml' <<'FIN_DU_FICHIER'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Budget familial"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FIN_DU_FICHIER

      - name: "Appli - MainActivity.java"
        run: |
          mkdir -p "$(dirname 'android/app/src/main/java/com/heryzo/budgetfamilial/MainActivity.java')"
          cat > 'android/app/src/main/java/com/heryzo/budgetfamilial/MainActivity.java' <<'FIN_DU_FICHIER'
          package com.heryzo.budgetfamilial;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final int FILE_REQ = 42;
              private WebView web;
              private ValueCallback<Uri[]> fileCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.parseColor("#0b1f4b"));
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0b1f4b"));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setTextZoom(100);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if ("file".equals(u.getScheme())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                          return true;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          try {
                              startActivityForResult(Intent.createChooser(i, "Choisir une sauvegarde"), FILE_REQ);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  setContentView(web);
                  if (savedInstanceState != null) web.restoreState(savedInstanceState);
                  else web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_REQ && fileCallback != null) {
                      Uri[] result = null;
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) result = new Uri[]{data.getData()};
                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  String js = "(function(){var o=document.getElementById('ov');if(o&&o.classList.contains('on')){o.classList.remove('on');document.body.style.overflow='';return 1}return 0})()";
                  web.evaluateJavascript(js, new ValueCallback<String>() {
                      @Override
                      public void onReceiveValue(String v) {
                          if (!"1".equals(v)) MainActivity.super.onBackPressed();
                      }
                  });
              }
          }
          FIN_DU_FICHIER

