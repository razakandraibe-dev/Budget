      - name: Icône et page de l'appli
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/assets
          cp icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp index.html android/app/src/main/assets/index.html

      - name: Fabriquer l'APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk budget-familial.apk

      - name: Garder l'APK dans les résultats
        uses: actions/upload-artifact@v4
        with:
          name: budget-familial-apk
          path: budget-familial.apk

      - name: Publier l'APK (page Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Budget familial v${{ github.run_number }}
          body: APK de l'appli Budget familial. Télécharge budget-familial.apk et installe-le.
          files: budget-familial.apk
          make_latest: true
